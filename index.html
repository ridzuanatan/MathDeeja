    <meta name="theme-color" content="#a855b7"><meta name="author" content="Ridzuan Atan"><title>MathDeeja</title><style>
:root{--p:#a855b7;--d:#49305f;--l:#fff0fc;--g:#24ad7b;--r:#e94c70}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#ffe486 0 4%,transparent 4.2%),radial-gradient(circle at 92% 10%,#b8f0da 0 6%,transparent 6.2%),linear-gradient(135deg,#fff0fb,#eee8ff);font-family:ui-rounded,"Arial Rounded MT Bold",Arial,sans-serif;color:var(--d)}button,input{font:inherit}button{border:0;cursor:pointer;touch-action:manipulation}.app{width:min(100%,680px);min-height:100vh;margin:auto;padding:clamp(16px,4vw,32px) 20px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}.brand{font-size:clamp(27px,6vw,39px);font-weight:1000;letter-spacing:-1.5px;color:var(--p)}.pill{background:#fff;padding:10px 14px;border-radius:99px;font-size:14px;font-weight:900;box-shadow:0 5px 18px #74407b22}.card{background:#fff;border-radius:30px;padding:clamp(24px,6vw,42px);box-shadow:0 16px 42px #72507822;text-align:center;position:relative;overflow:hidden}.card:before{content:"";width:115px;height:115px;background:#ffd4f4;position:absolute;border-radius:50%;top:-50px;left:-40px}.hidden{display:none!important}.princess{font-size:clamp(86px,22vw,142px);line-height:1;filter:drop-shadow(0 12px 6px #79508432);margin:0 0 8px;animation:float 2.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}h1{font-size:clamp(31px,7vw,48px);margin:7px 0 10px;letter-spacing:-1.6px}p{font-size:17px;line-height:1.5;margin:0 auto 23px;max-width:430px}.primary{background:var(--p);color:#fff;padding:15px 24px;border-radius:17px;font-weight:1000;font-size:18px;box-shadow:0 5px 0 #783387}.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #783387}.secondary{padding:11px 16px;border-radius:14px;background:#f7e9f8;color:#91409d;font-weight:900}.operations{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:0 auto}.op{background:#faf0fb;border:3px solid transparent;border-radius:19px;padding:16px 10px;font-weight:1000;color:#864492;font-size:17px}.op span{display:block;font-size:33px;line-height:1.1;margin-bottom:5px}.op.selected{background:#f8dafa;border-color:var(--p);box-shadow:0 5px 0 #dcafe4}.note{font-size:13px;font-weight:800;color:#8a718e;margin-top:18px}.progress{height:13px;border-radius:99px;background:#f0e6f2;overflow:hidden;margin-bottom:27px}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#a855b7,#ed82c7);transition:width .35s}.label{font-size:14px;font-weight:1000;color:#98759f}.sum{font-size:clamp(54px,15vw,88px);font-weight:1000;line-height:1.12;margin:13px 0 28px;color:#513165;letter-spacing:-4px}.answer{width:min(100%,320px);font-size:29px;font-weight:1000;color:var(--d);text-align:center;padding:14px;border:3px solid #eed9f0;border-radius:18px;outline:0}.answer:focus{border-color:var(--p);box-shadow:0 0 0 5px #f5dffc}.feedback{min-height:29px;margin:13px 0 8px;font-weight:1000;font-size:17px}.good{color:var(--g)}.bad{color:var(--r)}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.icon{font-size:68px;line-height:1}.result h2{font-size:clamp(29px,7vw,42px);margin:9px 0}.score{font-size:25px;font-weight:1000;color:var(--p);margin:14px 0}.stars{font-size:30px;letter-spacing:4px}.review{margin:20px 0;text-align:left;background:#fff8fe;border-radius:18px;padding:13px 17px;max-height:190px;overflow:auto}.review div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0e3f0;font-weight:900}.review div:last-child{border:0}.ok{color:var(--g)}.no{color:var(--r)}.toast{position:fixed;z-index:5;top:17%;left:50%;transform:translate(-50%,-10px);opacity:0;background:#fff;color:#9443a1;padding:12px 20px;border-radius:20px;box-shadow:0 9px 25px #69337435;font-weight:1000;transition:.3s;text-align:center;max-width:calc(100% - 30px);pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.confetti{position:fixed;z-index:6;top:-20px;width:10px;height:16px;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(650deg);opacity:0}}footer{text-align:center;padding:20px 5px 0;color:#806987;font-size:12px;line-height:1.5;font-weight:800}footer b{color:var(--p)}@media(max-width:390px){.card{border-radius:24px;padding:25px 18px}.top{margin-bottom:13px}.pill{padding:8px 10px}}
</style></head><body><main class="app"><div class="top"><div class="brand">MathDeeja ✨</div><div class="pill" id="cycle">Pusingan 1 / 10</div></div>
<section class="card" id="home"><div class="princess" aria-hidden="true">👸</div><h1>Jom kira bersama!</h1><p>Pilih operasi dahulu. Setiap pusingan mengandungi <b>10 soalan rawak</b> untuk satu operasi sahaja.</p><div class="operations"><button class="op selected" data-op="+"><span>＋</span>Operasi Tambah</button><button class="op" data-op="−"><span>−</span>Operasi Tolak</button></div><br><button class="primary" id="start">Mula latihan 🚀</button><div class="note">Nombor 1 hingga 12 · Tekan Enter untuk semak</div></section>
<section class="card hidden" id="quiz"><div class="progress"><i id="bar"></i></div><div class="label" id="label"></div><div class="sum" id="sum"></div><input class="answer" id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="?" aria-label="Jawapan"><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="check">Semak jawapan</button><button class="secondary" id="quit">Saya mahu berhenti</button></div></section>
<section class="card result hidden" id="result"><div class="icon" id="icon">🏆</div><h2 id="title"></h2><p id="text"></p><div class="score" id="score"></div><div class="stars" id="stars"></div><div class="review" id="review"></div><div class="actions"><button class="primary" id="next"></button><button class="secondary" id="back">Kembali ke mula</button></div></section><footer>Dicipta dan dibangunkan oleh <b>Ridzuan Atan</b><br>© 2026 Ridzuan Atan. Semua hak cipta terpelihara.</footer></main><div class="toast" id="toast"></div>
<script>const $=x=>document.getElementById(x),say=['Hebat! Teruskan! 🌟','Bagus sangat! 💪','Kamu semakin bijak! ✨','Cuba lagi, kamu boleh! 🌈'];let cycle=1,operation='+',qs=[],previous=[],i=0,answers=[],locked=false,quit=false;function page(x){['home','quiz','result'].forEach(y=>$(y).classList.toggle('hidden',x!==y))}function pop(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}function make(){let pool=[];for(let a=1;a<=12;a++)for(let b=1;b<=12;b++)pool.push({a,b,op:operation});let picked;do{pool.sort(()=>Math.random()-.5);picked=pool.slice(0,10)}while(previous.length&&picked.filter(q=>previous.includes(q.a+q.op+q.b)).length>2);previous=picked.map(q=>q.a+q.op+q.b);qs=picked.map(q=>q.op==='−'&&q.b>q.a?{a:q.b,b:q.a,op:q.op}:q)}function begin(){make();i=0;answers=[];locked=false;quit=false;page('quiz');render()}function render(){locked=false;let q=qs[i];$('label').textContent=`${operation==='+'?'TAMBAH':'TOLAK'} · SOALAN ${i+1} DARIPADA 10`;$('sum').textContent=`${q.a} ${q.op} ${q.b}`;$('bar').style.width=i*10+'%';$('answer').value='';$('feedback').textContent='';$('feedback').className='feedback';$('check').textContent='Semak jawapan';$('answer').focus()}function check(){if(locked){i++;return i<10?render():finish()}let el=$('answer'),q=qs[i];if(el.value.trim()==='')return pop('Isi jawapan dahulu ya 😊');let answer=Number(el.value),correct=answer===(q.op==='+'?q.a+q.b:q.a-q.b);answers.push({...q,answer,correct});locked=true;$('feedback').textContent=correct?'Betul! Pandai! 🎉':`Jawapan: ${q.op==='+'?q.a+q.b:q.a-q.b}. Ingat untuk kali ini ya!`;$('feedback').className='feedback '+(correct?'good':'bad');$('check').textContent=i===9?'Lihat keputusan':'Soalan seterusnya';if(correct)pop(say[i%3])}function finish(){let total=answers.length,right=answers.filter(x=>x.correct).length,wrong=total-right,perfect=total===10&&right===10,near=total===10&&wrong<=2;$('bar').style.width=total*10+'%';$('icon').textContent=perfect?'🏆':near?'👏':quit?'💛':'🌟';$('title').textContent=perfect?'Sempurna! Kamu juara!':near?'Hampir sempurna! Hebat!':quit?'Tidak mengapa, kamu sudah mencuba!':'Usaha yang sangat baik!';$('text').textContent=perfect?'Semua jawapan betul—masa untuk meraikan kejayaan!':near?'Cuma '+wrong+' jawapan perlu diperbaiki. Teruskan!':quit?'Prestasi dikira daripada '+total+' soalan yang telah dijawab.':'Setiap latihan menjadikan kamu lebih hebat.';$('score').textContent=`${right} / ${total} jawapan betul`;$('stars').textContent=perfect?'⭐⭐⭐⭐⭐':near?'⭐⭐⭐⭐':'⭐⭐⭐';$('review').innerHTML=answers.length?answers.map((q,n)=>{let val=q.op==='+'?q.a+q.b:q.a-q.b;return `<div><span>${n+1}. ${q.a} ${q.op} ${q.b} = ${val}</span><span class="${q.correct?'ok':'no'}">${q.correct?'✓':'✗ '+q.answer}</span></div>`}).join(''):'<div>Belum ada jawapan untuk dikira.</div>';$('next').textContent=cycle>=10?'Reset semua pusingan 🔄':'Pusingan seterusnya 🎲';page('result');if(perfect||near)confetti();pop(perfect?'Tepukan untuk kamu! 👏👏👏':near?'Hebat! Tinggal sedikit sahaja! 💫':say[3])}function confetti(){for(let n=0;n<45;n++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#a855b7','#ffcd55','#38bb91','#f36b9a'][n%4];c.style.setProperty('--x',Math.random()*220-110+'px');c.style.animationDelay=Math.random()*.35+'s';document.body.append(c);setTimeout(()=>c.remove(),2800)}}document.querySelectorAll('.op').forEach(b=>b.onclick=()=>{operation=b.dataset.op;previous=[];document.querySelectorAll('.op').forEach(x=>x.classList.toggle('selected',x===b))});$('start').onclick=begin;$('check').onclick=check;$('quit').onclick=()=>{quit=true;finish()};$('answer').onkeydown=e=>{if(e.key==='Enter')check()};$('next').onclick=()=>{if(cycle>=10){cycle=1;previous=[]}else cycle++;$('cycle').textContent=`Pusingan ${cycle} / 10`;begin()};$('back').onclick=()=>page('home');</script></body></html>
